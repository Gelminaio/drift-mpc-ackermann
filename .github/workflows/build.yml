name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  firmware-build:
    name: ESP32 Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ci

  ros2-build:
    name: ROS 2 Packages (colcon)
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep

      - name: Resolve ROS dependencies with rosdep
        shell: bash
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      # acados for ackermann_nmpc, as in docs/nmpc.md
      - name: Cache acados
        id: acados-cache
        uses: actions/cache@v4
        with:
          path: /opt/acados
          key: acados-v0.6.0-${{ runner.os }}

      - name: Build acados
        if: steps.acados-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch v0.6.0 --depth 1 --recurse-submodules --shallow-submodules https://github.com/acados/acados.git /opt/acados
          cmake -S /opt/acados -B /opt/acados/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /opt/acados/build --target install -j4
          mkdir -p /opt/acados/bin
          curl -L -o /opt/acados/bin/t_renderer https://github.com/acados/tera_renderer/releases/download/v0.2.0/t_renderer-v0.2.0-linux-amd64
          chmod +x /opt/acados/bin/t_renderer

      - name: Install the acados python interface
        run: |
          apt-get install -y python3-pip
          pip install --break-system-packages -e /opt/acados/interfaces/acados_template casadi==3.7.2

      - name: Build workspace
        shell: bash
        working-directory: ros2_ws
        env:
          ACADOS_SOURCE_DIR: /opt/acados
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+