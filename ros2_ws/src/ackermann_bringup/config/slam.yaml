# slam_toolbox, mapping, run on the desktop; the rest at the package defaults
slam_toolbox:
  ros__parameters:
    mode: mapping
    base_frame: base_footprint
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 12.0           # RPLIDAR A1
    minimum_travel_distance: 0.2    # small car, small room
    minimum_travel_heading: 0.3
