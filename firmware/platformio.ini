[platformio]
default_envs = esp32dev

[env:esp32dev]
; pinned: 8.0.0 (Arduino core 3, ESP-IDF 5) changes esp_task_wdt_init and breaks the build
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time, send_on_enter
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
lib_deps = 
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12
    https://github.com/micro-ROS/micro_ros_platformio

board_microros_distro = jazzy
board_microros_transport = serial

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -Wall
    -Wformat=2
build_unflags = 
    -std=gnu++11

board_build.partitions = default.csv

[env:ci]
extends = env:esp32dev
build_flags = 
    ${env:esp32dev.build_flags}
    -DUSE_MICROROS=0
lib_deps = 
    sparkfun/SparkFun BNO080 Cortex Based IMU @ ^1.1.12

; host-side unit tests of the control library (PID, safety supervisor), no board needed:
; pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -Wall
    -Itest/stubs
lib_ignore = comms, drivers, tasks
